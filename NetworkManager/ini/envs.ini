# ESP32

[esp32dev]
board = esp32dev

[env:esp32dev_debug]
extends = esp32dev
build_type = debug
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    ; Development-only: the current AsyncWebServer stack is plain HTTP.
    -DEASYNETWORKMANAGER_ALLOW_INSECURE_HTTP
    -DCORE_DEBUG_LEVEL=4
    '-DWIFI_SSID=${sim.ssid}'
	'-DWIFI_PASSWORD=${sim.password}'

[env:esp32dev_release]
extends = esp32dev
build_type = release
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    -DDEBUG_ESP_OTA
    -DCORE_DEBUG_LEVEL=1
    '-DWIFI_SSID=${wifi.ssid}'
	'-DWIFI_PASSWORD=${wifi.password}'

[env:esp32dev_ota]
extends = esp32dev_release
build_src_filter =
    +<*>
upload_port = ${ota.otaserverip}
upload_protocol = espota
upload_flags =
	--port=${ota.otaserverport}
	--auth=${ota.otapassword}

# ESP32S3

[esp32s3]
board = esp32-s3-devkitc-1

[env:esp32s3_debug]
extends = esp32s3
build_type = debug
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    ; Development-only: the current AsyncWebServer stack is plain HTTP.
    -DEASYNETWORKMANAGER_ALLOW_INSECURE_HTTP
    -DCORE_DEBUG_LEVEL=4
    '-DWIFI_SSID=${sim.ssid}'
	'-DWIFI_PASSWORD=${sim.password}'

[env:wokwi]
extends = esp32s3
build_type = debug
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DWOKWI_FIXTURE
    ; Wokwi uses the trusted simulator network for bootstrap/testing only.
    -DEASYNETWORKMANAGER_ALLOW_INSECURE_HTTP
    -DEASYNETWORKMANAGER_ALLOW_INSECURE_OTA
    '-DWIFI_SSID=${sim.ssid}'
	'-DWIFI_PASSWORD=${sim.password}'
    '-DWOKWI_API_LOGIN=${sim.api_login}'
    '-DWOKWI_API_PASSWORD=${sim.api_password}'

[env:esp32s3_release]
extends = esp32s3
build_type = release
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    -DDEBUG_ESP_OTA
    -DCORE_DEBUG_LEVEL=1
    '-DWIFI_SSID=${wifi.ssid}'
	'-DWIFI_PASSWORD=${wifi.password}'

[env:esp32s3_ota]
extends = esp32s3_release
build_src_filter =
    +<*>
upload_port = ${ota.otaserverip}
upload_protocol = espota
upload_flags =
	--port=${ota.otaserverport}
	--auth=${ota.otapassword}

# ESP8266

[esp8266]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs

[env:esp8266_debug]
extends = esp8266
build_type = debug
build_src_filter =
    +<*>
lib_deps =
    https://github.com/ZanzyTHEbar/EasyHelpers.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/ESPAsyncTCP.git
    https://github.com/bblanchon/ArduinoJson.git
build_flags =
    ${env.build_flags}
    ; Development-only: the current AsyncWebServer stack is plain HTTP.
    -DEASYNETWORKMANAGER_ALLOW_INSECURE_HTTP
    -DCORE_DEBUG_LEVEL=4
    '-DWIFI_SSID=${sim.ssid}'
    '-DWIFI_PASSWORD=${sim.password}'

[env:esp8266_release]
extends = esp8266
build_type = release
build_src_filter =
    +<*>
; Mirrors esp8266_debug: ESPAsyncTCP replaces the ESP32-only AsyncTCP from [env].
lib_deps =
    https://github.com/ZanzyTHEbar/EasyHelpers.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/ESPAsyncTCP.git
    https://github.com/bblanchon/ArduinoJson.git
build_flags =
    ${env.build_flags}
    -DDEBUG_ESP_OTA
    -DCORE_DEBUG_LEVEL=1
    '-DWIFI_SSID=${wifi.ssid}'
    '-DWIFI_PASSWORD=${wifi.password}'

[env:esp32dev_extras_ota]
extends = esp32dev
build_type = release
; Compiles the standalone extras/ota sketch outside the library src tree.
; PIO 6.x has no per-env src_dir, so a pre-script relocates PROJECT_SRC_DIR.
lib_deps =
extra_scripts =
    pre:tools/customname.py
    pre:extras/ota/relocate_src.py
    post:tools/createwokwi.py
build_flags =
    ${env.build_flags}
    -DDEBUG_ESP_OTA
    -DCORE_DEBUG_LEVEL=1
    '-DWIFI_SSID=${wifi.ssid}'
    '-DWIFI_PASSWORD=${wifi.password}'
