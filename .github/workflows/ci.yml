name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Run native Unity tests
        run: pio test -d NetworkManager -e native

  firmware-matrix:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev_debug
          - esp32dev_release
          - esp32s3_debug
          - esp32s3_release
          - wokwi
          - esp8266_debug
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('NetworkManager/platformio.ini', 'NetworkManager/ini/*.ini') }}
          restore-keys: ${{ runner.os }}-pio-${{ matrix.env }}-
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build firmware
        run: pio run -d NetworkManager -e ${{ matrix.env }}

  ui-and-hygiene:
    name: UI regeneration & hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install UI dependencies
        working-directory: NetworkManager/ui
        run: npm install --no-package-lock --ignore-scripts
      - name: Syntax-check compressor
        working-directory: NetworkManager/ui
        run: node --check compress.js
      - name: Regenerate embedded web assets
        working-directory: NetworkManager/ui
        run: node compress.js
      - name: Fail if generated assets are stale
        run: git diff --exit-code -- NetworkManager/include/data/webpage.h
      - name: Check for whitespace errors
        run: git diff --check
