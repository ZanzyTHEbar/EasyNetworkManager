name: Release
on:
  push:
    branches:
      - main
jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Run native Unity tests
        run: pio test -d NetworkManager -e native
      - name: Build representative firmware
        run: pio run -d NetworkManager -e esp32dev_release
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install UI dependencies
        working-directory: NetworkManager/ui
        run: npm install --no-package-lock --ignore-scripts
      - name: Regenerate embedded web assets
        working-directory: NetworkManager/ui
        run: node compress.js
      - name: Fail if generated assets are stale
        run: git diff --exit-code -- NetworkManager/include/data/webpage.h
      - name: Check for whitespace errors
        run: git diff --check

  release:
    name: Release
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install -g conventional-changelog-conventionalcommits@6
      - run: npm install -g semantic-release@v19.0.5
      - run: npm install -g @semantic-release/exec
      - run: npm install -g @semantic-release/git
      - run: npm install -g @semantic-release/github
      - run: npm install -g @semantic-release/changelog
      - run: npm install -g @semantic-release/release-notes-generator
      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v2
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Set up Python
        uses: actions/setup-python@v2
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: semantic-release
